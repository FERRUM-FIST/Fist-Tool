<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- Outer Dark Shadow/Glow for Contrast on Any Background -->
  <circle cx="16" cy="16" r="1.5" fill="#000000" opacity="0.6"/>
  
  <!-- Precision Gaming Reticle Outer Ring -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="#FF3547" stroke-width="1.2" stroke-dasharray="2.5 3" opacity="0.85"/>

  <!-- Tactical Ticks (Top, Bottom, Left, Right) -->
  <line x1="16" y1="2" x2="16" y2="8" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="2" x2="16" y2="8" stroke="#FF3547" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="16" y1="24" x2="16" y2="30" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="16" y2="30" stroke="#FF3547" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="2" y1="16" x2="8" y2="16" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="8" y2="16" stroke="#FF3547" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="24" y1="16" x2="30" y2="16" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="30" y2="16" stroke="#FF3547" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center Aim Dot -->
  <circle cx="16" cy="16" r="1.8" fill="#000000"/>
  <circle cx="16" cy="16" r="1.2" fill="#FFFFFF"/>
</svg>
