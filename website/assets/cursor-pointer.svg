<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- Target-Lock Corner Brackets (Hover State) -->
  <!-- Top Left Bracket -->
  <path d="M 8 13 L 8 8 L 13 8" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 8 13 L 8 8 L 13 8" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Right Bracket -->
  <path d="M 19 8 L 24 8 L 24 13" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 19 8 L 24 8 L 24 13" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Left Bracket -->
  <path d="M 8 19 L 8 24 L 13 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 8 19 L 8 24 L 13 24" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Right Bracket -->
  <path d="M 19 24 L 24 24 L 24 19" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 19 24 L 24 24 L 24 19" fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Target Dot with Cyan Ring -->
  <circle cx="16" cy="16" r="3" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="16" cy="16" r="3" fill="none" stroke="#00E5FF" stroke-width="1.2"/>
  <circle cx="16" cy="16" r="1.5" fill="#FFFFFF"/>
</svg>
